name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Build & Quality Gate (P-DEV-03)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: TypeScript compile
        run: pnpm run build

      - name: Run full test suite
        run: pnpm test

      - name: Verify Bun workspace core bundles
        run: bun build packages/poller/src/index.ts --outdir /tmp/poller-ci-check --target bun